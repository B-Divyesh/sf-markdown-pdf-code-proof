[package]
name = "codeproof"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Release checks for code-heavy Markdown PDFs"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-markdown-pdf-code-proof"
readme = "../README.md"
keywords = ["markdown", "pdf", "documentation", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "codeproof"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
lopdf = "0.38"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1.1"
tempfile = "3.20"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
